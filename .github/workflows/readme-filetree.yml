name: Update README file tree

on:
  push:
    branches: [ main ]     # 如果你的預設分支是 master，就改成 master
  workflow_dispatch:        # 允許手動觸發

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'  # 避免自己觸發自己
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate file tree markdown
        run: |
          python - << 'EOF'
          import os

          EXCLUDE = {'.git', '.github', 'node_modules', '__pycache__'}
          MAX_DEPTH = 3  # 想顯示更深的層級就改大

          def walk(dir_path='.', depth=0, out=None):
              if out is None:
                  out = []
              if depth > MAX_DEPTH:
                  return out

              entries = sorted(
                  e for e in os.listdir(dir_path)
                  if e not in EXCLUDE and not e.startswith('.')
              )

              for name in entries:
                  full = os.path.join(dir_path, name)
                  rel = os.path.relpath(full, '.')
                  indent = '  ' * depth

                  if os.path.isdir(full):
                      out.append(f"{indent}- [{name}]({rel}/)")
                      walk(full, depth + 1, out)
                  else:
                      out.append(f"{indent}- [{name}]({rel})")

              return out

          lines = walk()
          with open("FILETREE.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Inject file tree into README
        run: |
          python - << 'EOF'
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()
          with open("FILETREE.md", "r", encoding="utf-8") as f:
              tree = f.read().rstrip()

          pattern = r"(<!-- FILETREE_START -->)(.*?)(<!-- FILETREE_END -->)"
          new_readme = re.sub(
              pattern,
              lambda m: m.group(1) + "\n\n" + tree + "\n\n" + m.group(3),
              readme,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update file tree in README [skip ci]"
          git push
