name: Update HTML list in README

on:
  push:
    branches: [ main ]   # 如果你的預設分支是 master，就改成 master
  workflow_dispatch:

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML list markdown
        run: |
          python - << 'EOF'
          import os

          EXCLUDE_DIRS = {'.git', '.github', 'node_modules', '__pycache__'}
          BASE_URL = "https://mahjongr.github.io/Soul"  # 之後有開 GitHub Pages 就會用到

          rows = []

          for root, dirs, files in os.walk("."):
              # 過濾不要掃的資料夾
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS and not d.startswith('.')]

              rel_root = os.path.relpath(root, ".")
              depth = 0 if rel_root == "." else rel_root.count(os.sep)

              for name in sorted(files):
                  if not name.lower().endswith(".html"):
                      continue

                  rel_path = os.path.join(rel_root, name) if rel_root != "." else name
                  rel_path = rel_path.replace("\\", "/")  # 保險一點，處理 Windows 斜線
                  indent = "  " * depth

                  if BASE_URL:
                      page_url = f"{BASE_URL}/{rel_path}"
                      line = f"{indent}- [{rel_path}]({page_url}) · [原始檔]({rel_path})"
                  else:
                      line = f"{indent}- [{rel_path}]({rel_path})"

                  rows.append(line)

          with open("HTML_LIST.md", "w", encoding="utf-8") as f:
              f.write("\n".join(rows) + "\n")
          EOF

      - name: Inject HTML list into README
        run: |
          python - << 'EOF'
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()
          with open("HTML_LIST.md", "r", encoding="utf-8") as f:
              html_list = f.read().rstrip()

          pattern = r"(<!-- HTML_LIST_START -->)(.*?)(<!-- HTML_LIST_END -->)"
          new_readme = re.sub(
              pattern,
              lambda m: m.group(1) + "\n\n" + html_list + "\n\n" + m.group(3),
              readme,
              flags=re.S,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update HTML list in README [skip ci]"
          git push
