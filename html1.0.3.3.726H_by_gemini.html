<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/><title>筒子聽牌機 1.08s</title>
<style>
  :root { 
    --bg: #f7f7f7; --text: #333; --card-bg: #fff; --slot-border: #333;
    --tw: clamp(32px, 7.2vw, 70px); --th: calc(var(--tw) * 1.25); --tf: calc(var(--tw) * 0.95); 
  }
  /* 深色模式變數 */
  [data-theme='dark'] { --bg: #1a1a1a; --text: #eee; --card-bg: #333; --slot-border: #999; }

  body { font-family: sans-serif; margin: 10px; background: var(--bg); color: var(--text); text-align: center; transition: background 0.3s, color 0.3s; }
  
  /* 右上角切換開關 */
  .theme-toggle { position: absolute; top: 10px; right: 10px; z-index: 100; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 14px; }
  
  #hand, #extra { display: flex; justify-content: center; gap: 4px; margin-bottom: 8px; min-height: var(--th); }
  .slot, .p-tile { width: var(--tw); height: var(--th); border: 2px solid var(--slot-border); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; overflow: hidden; line-height: 1; transition: border 0.3s; }
  
  .slot { font-size: var(--tf); background: #0a0; color: #fff; border-color: #333; }
  .slot.ex { background: #07f; }
  .slot.ex:empty { background: rgba(0, 119, 255, 0.15); border: 2px dashed #05a; }

  #pool { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; max-width: 500px; margin: 12px auto; }
  .p-tile { font-size: calc(var(--tf) * 0.8); background: var(--card-bg); border: 1px solid #aaa; width: auto; color: var(--text); }
  
  button { margin: 0 4px; padding: 6px 10px; cursor: pointer; border-radius: 4px; border: 1px solid #999; background: var(--card-bg); color: var(--text); font-size: 14px; }

  .result-container { position: relative; margin-top: 5px; min-height: 50px; }
  #msg { position: absolute; top: 0; left: 50%; transform: translateX(-50%); color: #ff4d4d; font-weight: bold; font-size: 16px; background: var(--bg); padding: 0 10px; z-index: 10; pointer-events: none; transition: opacity 0.3s; opacity: 0; }
  
  .res { text-align: left; display: inline-block; font-size: 17px; line-height: 1.6; }
  .note { color: var(--text); opacity: 0.7; font-size: 0.85em; font-weight: bold; }
</style>
</head>
<body>

<div class="theme-toggle" onclick="toggleTheme()">
  <span id="theme-text">🌙 深色模式</span>
</div>

<h3>筒子聽牌機 1.08s</h3>
<div id="hand"></div><div id="extra"></div><div id="pool"></div>
<div class="btn-group">
  <button onclick="clearAll()">清理 (Esc)</button>
  <button onclick="undo()">復原 (←)</button>
  <button onclick="sortM=!sortM;r()">排序 (S)</button>
</div>
<div class="result-container"><div id="msg"></div><div id="res" class="res"></div></div>

<script>
const T=['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'], sup=['⁰','¹','²','³','⁴'];
let h=[], bk=[], sortM=false;
const handD=document.getElementById('hand'), exD=document.getElementById('extra'), poolD=document.getElementById('pool'), resD=document.getElementById('res'), msgD=document.getElementById('msg');

// 主題切換邏輯
function toggleTheme() {
  const b = document.body;
  const isDark = b.getAttribute('data-theme') === 'dark';
  b.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-text').textContent = isDark ? '🌙 深色模式' : '☀️ 淺色模式';
}

// 鍵盤與初始化邏輯
for(let i=0;i<13;i++){ let s=document.createElement('div'); s.className='slot'; s.onclick=()=>rm(i); handD.append(s); }
T.forEach((t,i)=>{ let s=document.createElement('div'); s.className='p-tile'; s.textContent=t; s.onclick=()=>add(i); poolD.append(s); });

document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') add(parseInt(e.key) - 1);
  else if (e.key === 'Backspace') undo();
  else if (e.key === 'Escape' || e.key === 'Delete') clearAll();
  else if (e.key.toLowerCase() === 's') { sortM = !sortM; r(); }
});

function showMsg(m){ msgD.textContent=m; msgD.style.opacity=1; clearTimeout(window.mt); window.mt=setTimeout(()=>msgD.style.opacity=0, 1200); }
function clearAll(){ if(!h.length) return; bk=[...h]; h=[]; r(); showMsg('已清理'); }
function undo(){ 
  if(!bk.length && !h.length) return showMsg('無紀錄');
  [h, bk] = [bk, h]; r(); showMsg(h.length?'已復原':'已回原狀');
}
function add(v){
  if(h.filter(x=>x===v).length>=4) return showMsg('上限4張');
  if(h.length>=18) return showMsg('手牌已滿');
  bk=[...h]; h.push(v); r();
}
function rm(i){ if(h[i]===undefined) return; bk=[...h]; h.splice(i,1); r(); }

function r(){
  h.sort((a,b)=>a-b);
  document.querySelectorAll('#hand .slot').forEach((x,i)=>x.textContent=h[i]!==undefined?T[h[i]]:'');
  exD.innerHTML='';
  for(let i=13;i<18;i++){
    let x=document.createElement('div'); x.className='slot ex';
    if(h[i]!==undefined){ x.textContent=T[h[i]]; x.onclick=()=>rm(i); }
    exD.append(x);
  }
  if(h.length>=13) calc(); else resD.innerHTML='';
}

// 胡牌邏輯
function win(c){
  const check=(tc)=>{
    let f=tc.findIndex(v=>v>0); if(f===-1) return 1;
    if(tc[f]>=3){ tc[f]-=3; if(check(tc)) return 1; tc[f]+=3; }
    if(f<=6&&tc[f+1]>0&&tc[f+2]>0){ tc[f]--; tc[f+1]--; tc[f+2]--; if(check(tc)) return 1; tc[f]++; tc[f+1]++; tc[f+2]++; }
    return 0;
  };
  for(let i=0;i<9;i++) if(c[i]>=2){ let t=[...c]; t[i]-=2; if(check(t)) return 1; }
  return (c.filter(v=>v===2).length===7);
}
function getW(arr13){
  let w=[], c=Array(9).fill(0); arr13.forEach(v=>c[v]++);
  for(let i=0;i<9;i++) if(c[i]<4){ c[i]++; if(win(c)) w.push(i); c[i]--; }
  return w;
}
function calc(){
  let resArr=[]; const cAll=Array(9).fill(0); h.forEach(v=>cAll[v]++);
  if(h.length===13){
    let w=getW(h); if(w.length) resArr.push({d:[],w});
  } else {
    let combos=[], diff=h.length-13;
    const findC=(st,curr)=>{
      if(curr.length===diff){
        let rem=[...h]; curr.sort((a,b)=>b-a).forEach(idx=>rem.splice(idx,1));
        let w=getW(rem); if(w.length) combos.push({d:curr.map(i=>h[i]),w:w.sort((a,b)=>a-b)});
        return;
      }
      for(let i=st;i<h.length;i++){ curr.push(i); findC(i+1,curr); curr.pop(); }
    };
    findC(0,[]);
    let seen=new Set(); combos.forEach(x=>{ let k=x.w.join(','); if(!seen.has(k)){ seen.add(k); resArr.push(x); }});
  }
  if(!resArr.length) return resD.textContent='沒有聽牌';
  let list=resArr.map(obj=>{
    let sum=0, ws=obj.w.map(i=>{let rem=4-cAll[i]; sum+=rem; return T[i]+sup[rem]}).join(' ');
    return {txt:`${obj.d.length?'捨 '+obj.d.map(i=>T[i]).join('')+' → ':''}聽 ${ws}`, sum};
  });
  if(sortM) list.sort((a,b)=>b.sum-a.sum);
  resD.innerHTML=list.map(l=>`${l.txt} <span class="note">剩${l.sum}張</span>`).join('<br>');
}
r();
</script>
</body>
</html>
