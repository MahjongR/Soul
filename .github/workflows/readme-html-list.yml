name: Update HTML list in README

on:
  push:
    branches: [ main ]   # 如果你的預設分支是 master，就改成 master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 需要完整歷史，才能查每個檔案最後修改時間
          fetch-depth: 0

      - name: Generate HTML list markdown
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import time

          EXCLUDE_DIRS = {'.git', '.github', 'node_modules', '__pycache__'}
          BASE_URL = "https://mahjongr.github.io/Soul"  # 有開 GitHub Pages 時用

          def get_last_commit_ts(path: str):
              """取得某個檔案最後一次 commit 的 Unix timestamp（秒）。"""
              try:
                  ts = subprocess.check_output(
                      ["git", "log", "-1", "--format=%ct", "--", path],
                      stderr=subprocess.DEVNULL,
                      text=True,
                  ).strip()
                  if not ts:
                      return None
                  return int(ts)
              except Exception:
                  return None

          def format_ago(ts):
              """把 timestamp 轉成 '5 days ago' / '12 hours ago' 這種字串。"""
              if ts is None:
                  return ""
              now = int(time.time())
              diff = max(0, now - ts)

              minute = 60
              hour = 60 * minute
              day = 24 * hour
              week = 7 * day

              if diff < minute:
                  return "just now"
              if diff < hour:
                  m = diff // minute
                  return f"{m} minute{'s' if m != 1 else ''} ago"
              if diff < day:
                  h = diff // hour
                  return f"{h} hour{'s' if h != 1 else ''} ago"
              if diff < week:
                  d = diff // day
                  return f"{d} day{'s' if d != 1 else ''} ago"
              w = diff // week
              return f"{w} week{'s' if w != 1 else ''} ago"

          rows = []

          for root, dirs, files in os.walk("."):
              # 過濾不要掃的資料夾
              dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS and not d.startswith('.')]

              rel_root = os.path.relpath(root, ".")
              depth = 0 if rel_root == "." else rel_root.count(os.sep)

              for name in sorted(files):
                  if not name.lower().endswith(".html"):
                      continue

                  rel_path = os.path.join(rel_root, name) if rel_root != "." else name
                  rel_path = rel_path.replace("\\", "/")  # 處理 Windows 斜線
                  indent = "  " * depth

                  last_ts = get_last_commit_ts(rel_path)
                  ago = format_ago(last_ts)
                  ago_suffix = f" · _{ago}_" if ago else ""

                  if BASE_URL:
                      page_url = f"{BASE_URL}/{rel_path}"
                      line = f"{indent}- [{rel_path}]({page_url}) · [原始檔]({rel_path}){ago_suffix}"
                  else:
                      line = f"{indent}- [{rel_path}]({rel_path}){ago_suffix}"

                  rows.append(line)

          with open("HTML_LIST.md", "w", encoding="utf-8") as f:
              f.write("\n".join(rows) + "\n")
          EOF

      - name: Inject HTML list into README and index
        run: |
          python3 - << 'EOF'
          import re
          import os

          with open("HTML_LIST.md", "r", encoding="utf-8") as f:
              html_list = f.read().rstrip()

          pattern = r"(<!-- HTML_LIST_START -->)(.*?)(<!-- HTML_LIST_END -->)"

          for filename in ("README.md", "index.md"):
              if not os.path.exists(filename):
                  continue

              with open(filename, "r", encoding="utf-8") as f:
                  text = f.read()

              new_text = re.sub(
                  pattern,
                  lambda m: m.group(1) + "\n\n" + html_list + "\n\n" + m.group(3),
                  text,
                  flags=re.S,
              )

              with open(filename, "w", encoding="utf-8") as f:
                  f.write(new_text)
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.md
          git commit -m "chore: update HTML list [skip ci]"
          git push
